# GLM-4.6 — Z.ai's flagship agentic coder. 357B total / 32B active (MoE),
# 200K context. MIT license. Q4 weights are ~200 GB; sharding required on
# anything below a top-tier server.
#
# Prereqs:
#   1. Download the GGUF, e.g.:
#        - https://huggingface.co/unsloth/GLM-4.6-GGUF           (recommended; dynamic quants)
#        - https://huggingface.co/zai-org/GLM-4.6                (original weights)
#      Concatenate the multi-part files into one .gguf, or point
#      llama.cpp at the first shard.
#   2. brew install llama.cpp on every node.
#   3. At least 4 workers joined.
id: glm-4.6-sharded
display_name: Z.ai GLM-4.6 (357B MoE / 32B active, sharded, agentic coder)
source:
  type: file
  path: /var/lib/opod/models/glm-4.6-q4_k_m.gguf
size_bytes: 200000000000
quant: q4_k_m
context_window: 200000
capabilities: [chat, code, reasoning, tools]
recommended_engines: [llamacpp]
hardware:
  min_ram_gb: 224
tags: [moe, sharded, frontier, coding, agentic]
license: mit
license_url: https://huggingface.co/zai-org/GLM-4.6
released: 2025-09-30
sharding:
  required: true
  default_shards: 4
  engine: llamacpp
  rpc_port_base: 50052
  coordinator_port: 9001
