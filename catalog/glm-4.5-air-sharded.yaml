# GLM-4.5-Air — Z.ai's mid-size agentic MoE. 106B total / 12B active.
# MIT license. Q4 weights are ~70 GB (multi-part GGUF); shards across
# 2 workers, or runs on a single 96 GB+ box.
#
# Prereqs:
#   1. Download the GGUF, e.g.:
#        - https://huggingface.co/unsloth/GLM-4.5-Air-GGUF        (recommended; dynamic quants)
#        - https://huggingface.co/zai-org/GLM-4.5-Air             (original weights)
#      Concatenate the multi-part Q4_K_M files into one .gguf, or point
#      llama.cpp at the first shard.
#   2. brew install llama.cpp on every node.
#   3. At least 2 workers joined.
