# `opod model add llama-3.2-3b-gguf --node a,b,c` launches a whole llama-server
# (-hf) on each worker; the router load-balances requests across the placements.
# Same weights as llama-3.2-3b-sharded but WITHOUT a sharding block, so it takes
# the per-node whole-model path (agent launchLlamaServer) instead of the shard
