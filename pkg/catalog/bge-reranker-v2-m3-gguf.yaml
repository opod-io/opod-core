# BGE Reranker v2 M3 as GGUF — the catalog's reranker (ADR-084: /v1/rerank is
# back). A cross-encoder: it scores (query, document) pairs, most relevant
# first; it generates nothing and embeds nothing.
#
# llama-server serves /v1/rerank only when started with --reranking. A control
# plane that knows the endpoint's protocol adds it; a hand-run worker pins it
# through the documented `extra` engine flag. vLLM serves the original
# safetensors (BAAI/bge-reranker-v2-m3, XLMRobertaForSequenceClassification)
# as a pooling model with no flag; this entry is the GGUF form for llama.cpp.
#
# Install:  opod model add bge-reranker-v2-m3-gguf
# Use:      POST /v1/rerank { "model": "bge-reranker-v2-m3-gguf", "query": "...", "documents": ["...", "..."] }
