blank_issues_enabled: false
contact_links:
  - name: 💬 Questions, help, or general discussion
    url: https://github.com/opod-io/opod-core/discussions
    about: Use Discussions for setup help, "how do I...", and design conversations. Issues are for bugs and specific feature requests.
  - name: 📦 New or corrected catalog model
    url: https://github.com/opod-io/opod-sdk/issues/new?template=catalog_request.yml
    about: The model catalog lives in opod-io/opod-sdk (one YAML per model, embedded into this binary). Request or PR it there.
  - name: 🔒 Security disclosure
    url: https://github.com/opod-io/opod-core/blob/main/SECURITY.md
    about: Please report security issues privately, not as a public GitHub Issue.
