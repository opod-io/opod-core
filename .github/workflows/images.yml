name: images
# RELEASE lane only (tags + manual dispatch). Day-to-day images are built on the
# Mac with images/build.sh — zero Actions minutes (paused 2026-09-05 after the
# per-push matrix burned ~1,200 of the 2,000 free minutes in five days).
# The llama.cpp RPC pairs that need a compiler (CUDA, SYCL) are NOT compiled here
# per push: each is a separate, dispatch-only job that publishes
# ghcr.io/opod-io/llama-rpc-<vendor>:<LLAMA_RELEASE> once per release bump; the
# worker build substitutes that image for the `rpc-<vendor>` stage via
# build-contexts. The ROCm pair needs neither: Dockerfile.rpc-rocm lifts it from
# upstream's release tarball during the worker build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rpc:
        description: "also rebuild llama-rpc-cuda:<LLAMA_RELEASE> (~60 min, only after bumping LLAMA_RELEASE)"
        type: boolean
        default: false
      rpc_sycl:
        description: "also rebuild llama-rpc-sycl:<LLAMA_RELEASE> (oneAPI icpx build; first publish, or after bumping LLAMA_RELEASE)"
        type: boolean
        default: false
      rpc_cpu:
        description: "also rebuild llama-rpc-cpu:<LLAMA_RELEASE> (amd64 + arm64, native runners; first publish, or after bumping LLAMA_RELEASE)"
        type: boolean
        default: false
      rpc_rocm:
        description: "also rebuild llama-rpc-rocm:<LLAMA_RELEASE> (HIP build covering Radeon + Instinct; first publish, or after bumping LLAMA_RELEASE)"
        type: boolean
        default: false
# id-token: write is what makes cosign keyless work — the signature is bound
# to this workflow's OIDC identity, so there is no key for us to lose (S3).
permissions: { contents: read, packages: write, id-token: write }
concurrency: { group: "images-${{ github.ref }}", cancel-in-progress: true }
jobs:
  rel:
    runs-on: ubuntu-latest
    outputs: { llama: "${{ steps.r.outputs.llama }}" }
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: echo "llama=$(sed -nE 's/^ARG LLAMA_RELEASE=(.*)$/\1/p' images/worker-llamacpp/Dockerfile.rpc-cuda)" >> "$GITHUB_OUTPUT"

  rpc:
    # ~60 min. Manual only, and only when LLAMA_RELEASE changed.
    if: github.event_name == 'workflow_dispatch' && inputs.rpc
    needs: rel
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true, large-packages: true, docker-images: false, swap-storage: false }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/worker-llamacpp/Dockerfile.rpc-cuda
          target: rpc-export
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-rpc-cuda:${{ needs.rel.outputs.llama }}
          build-args: LLAMA_RELEASE=${{ needs.rel.outputs.llama }}

  rpc-sycl:
    # The Intel pair: upstream's own SYCL recipe + GGML_RPC=ON (the sycl release
    # tarball ships no RPC backend). Manual only.
    if: github.event_name == 'workflow_dispatch' && inputs.rpc_sycl
    needs: rel
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true, large-packages: true, docker-images: false, swap-storage: false }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/worker-llamacpp/Dockerfile.rpc-sycl
          target: rpc-export
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-rpc-sycl:${{ needs.rel.outputs.llama }}
          build-args: LLAMA_RELEASE=${{ needs.rel.outputs.llama }}

  rpc-rocm:
    # The AMD pair, compiled for every target AMD ships — Instinct (gfx908/90a/942)
    # and Radeon (gfx1030/11xx/12xx) — because compiled GPU code has no fallback and
    # upstream's release tarball carries RDNA only.
    if: github.event_name == 'workflow_dispatch' && inputs.rpc_rocm
    needs: rel
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true, large-packages: true, docker-images: true, swap-storage: true }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/worker-llamacpp/Dockerfile.rpc-rocm
          target: rpc-export
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-rpc-rocm:${{ needs.rel.outputs.llama }}
          build-args: LLAMA_RELEASE=${{ needs.rel.outputs.llama }}

  rpc-cpu:
    # The CPU pair, built NATIVELY on each architecture — the arm64 half is what a
    # kind cluster on Apple silicon pulls, and compiling it under emulation is the
    # thing images/build.sh exists to avoid. Public repo, so the arm64 runner is free.
    if: github.event_name == 'workflow_dispatch' && inputs.rpc_cpu
    needs: rel
    strategy:
      matrix:
        include:
          - { arch: amd64, runs_on: ubuntu-latest }
          - { arch: arm64, runs_on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/worker-llamacpp/Dockerfile.rpc-cpu
          target: rpc-export
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository_owner }}/llama-rpc-cpu:${{ needs.rel.outputs.llama }}-${{ matrix.arch }}
          build-args: LLAMA_RELEASE=${{ needs.rel.outputs.llama }}

  rpc-cpu-index:
    # One tag the worker build can substitute, whatever platform it is building.
    if: github.event_name == 'workflow_dispatch' && inputs.rpc_cpu
    needs: [rel, rpc-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          set -euo pipefail
          ref=ghcr.io/${{ github.repository_owner }}/llama-rpc-cpu:${{ needs.rel.outputs.llama }}
          docker buildx imagetools create -t "$ref" "$ref-amd64" "$ref-arm64"
          got=$(docker buildx imagetools inspect "$ref" | awk '/^ *Platform: */{print $2}' | grep -c '^linux/')
          [ "$got" = 2 ] || { echo "::error::$ref is not a two-arch index (found $got)"; exit 1; }

  build:
    needs: [rel, rpc, rpc-sycl, rpc-cpu-index, rpc-rocm]
    if: >-
      always() && needs.rel.result == 'success'
      && (needs.rpc.result == 'success' || needs.rpc.result == 'skipped')
      && (needs.rpc-sycl.result == 'success' || needs.rpc-sycl.result == 'skipped')
      && (needs.rpc-cpu-index.result == 'success' || needs.rpc-cpu-index.result == 'skipped')
      && (needs.rpc-rocm.result == 'success' || needs.rpc-rocm.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # rpc: the compiled pair substituted for the rpc-<vendor> stage, or "" for none.
          - { name: opod-leader,                 file: images/leader/Dockerfile,          base: "", rpc: "", platforms: "linux/amd64,linux/arm64" }
          - { name: opod-worker-llamacpp-nvidia, file: images/worker-llamacpp/Dockerfile.rpc-cuda, base: ghcr.io/ggml-org/llama.cpp:full-cuda@sha256:204042f697dced0e99af35993e00c70b12386197d1bdd313f02b25f25f3118c8, rpc: cuda }  # base N=1 llama-server + prebuilt /opt/llama-rpc for N>=2
          - { name: opod-worker-llamacpp-amd,    file: images/worker-llamacpp/Dockerfile.rpc-rocm, base: ghcr.io/ggml-org/llama.cpp:full-rocm@sha256:aae65a3b275c602c091e2265f865e566b342c992ca984f40df76cd3fd6669785, rpc: rocm }  # prebuilt pair: Radeon + Instinct
          - { name: opod-worker-vllm-nvidia,     file: images/worker-vllm/Dockerfile,     base: vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967, rpc: "" }
          # The chart references these two as well; a release that does not publish
          # them leaves values.yaml pointing at images that do not exist.
          - { name: opod-worker-llamacpp-cpu,    file: images/worker-llamacpp/Dockerfile.rpc-cpu, base: "ghcr.io/ggml-org/llama.cpp:full@sha256:a04c81bf304f8b8f6141bb8bdc384d3c3a151624ba0901fa0c8a69baf2b8ac95", rpc: cpu, platforms: "linux/amd64,linux/arm64" }  # the pair, or a CPU worker cannot be a gang part
          - { name: opod-worker-llamacpp-intel,  file: images/worker-llamacpp/Dockerfile.rpc-sycl, base: "ghcr.io/ggml-org/llama.cpp:full-intel@sha256:d7c421aa93c8997b184e1b31ea8b81455ddc78e0ba2470213943d4d65f0cd452", rpc: sycl }  # base N=1 llama-server + prebuilt SYCL /opt/llama-rpc
          # The other engines the chart can reference. Each is a thin layer on a
          # vendor's own build, so the cost here is the base pull, not a compile.
          # vLLM is published per silicon by different people: upstream is CUDA-only,
          # AMD ships rocm/vllm per GPU family (RDNA here; a CDNA fleet overrides the
          # base), Intel ships intel/vllm for XPU, and Tenstorrent ships tt-metal's own
          # server — whose tag must match the model spec's commits (images/worker-tt).
          - { name: opod-worker-vllm-amd,        file: images/worker-vllm/Dockerfile,     base: "rocm/vllm:rocm7.14.1_rdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0@sha256:19ad8dc5fb3012f2d5810995f73e8bf069302056d2b4aa6fdf2d2ae5fa9a68ab", rpc: "" }
          - { name: opod-worker-vllm-intel,      file: images/worker-vllm/Dockerfile,     base: "intel/vllm:0.21.0-xpu@sha256:a76ac6b89350e0b3f5abccbfbe38474a27635666f988b4c3c181d856e51beecc", rpc: "" }
          - { name: opod-worker-vllm-tt,         file: images/worker-tt/Dockerfile,       base: "ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.10.0-55fd115-aa4ae1e@sha256:e48d532e8ea57141896af4cd2f098b406b081476a6cbb48d110c7f124873ea8f", rpc: "" }
          # SGLang is an engine core drives like any other (internal/engines/sglang,
          # launchSGLang, the sglang:cache_hit_rate the driver reads), so its images
          # ship with the rest. One node per endpoint until a multi-node path exists:
          # the planner refuses a gang on it, so the image promises nothing more.
          - { name: opod-worker-sglang-nvidia,   file: images/worker-sglang/Dockerfile,   base: "lmsysorg/sglang:v0.5.2-cu126@sha256:fce5585fa8da175224ead70727a4660f719e34adf0638aebf6dd27930f03e1b6", rpc: "" }
          - { name: opod-worker-sglang-amd,      file: images/worker-sglang/Dockerfile,   base: "lmsysorg/sglang:v0.5.19-rocm700-mi30x@sha256:590a815c128d7d5c83ef771ad768c9f8be82f64f7d0dbd98dc7b9f085b268a58", rpc: "" }
    steps:
      - name: Free disk space (the vLLM, ROCm and tt-metal bases are 7-30GB)
        if: contains(matrix.name, 'vllm') || contains(matrix.name, 'amd') || contains(matrix.name, '-tt') || contains(matrix.name, 'sglang')
        uses: jlumbroso/free-disk-space@main
        # docker-images + swap too: the ROCm vLLM and SGLang-Instinct bases are
        # 25-30 GB and ran the runner out of disk with the lighter cleanup (2026-09-15).
        with: { tool-cache: true, large-packages: true, docker-images: true, swap-storage: true }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # No floating tag: a moving `latest` is exactly the rolling upstream
          # tag ARCHITECTURE §7 forbids, and the CP re-pins a digest per
          # rollout (ADR-017). Release tags and the commit sha only.
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          # Only the leader's base exists for arm64; the GPU bases are amd64-only.
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.base != '' && format('BASE={0}', matrix.base) || '' }}
            VERSION=${{ github.sha }}
            LLAMA_RELEASE=${{ needs.rel.outputs.llama }}
          # Substitute the prebuilt RPC pair for the compiled rpc-<vendor> stage.
          build-contexts: ${{ matrix.rpc != '' && format('rpc-{0}=docker-image://ghcr.io/{1}/llama-rpc-{0}:{2}', matrix.rpc, github.repository_owner, needs.rel.outputs.llama) || '' }}
          # Registry cache: no 10 GB cap (the gha cache evicted every run → full rebuilds).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache,mode=max
      # ── supply chain (ARCHITECTURE §7, TASKS M19 S3) ───────────────────────
      # Everything below addresses the index digest, never a tag: a tag can be
      # moved, a digest cannot, and the digest is what the chart and ADR-017
      # pin. A customer verifies exactly what they pulled.
      - uses: sigstore/cosign-installer@v3
      - name: sign (keyless, Sigstore) + verify
        # A tag build MUST be signed — that is the release artifact (S3). A manual
        # dispatch must not be reported as failed because Sigstore's public log is
        # down: the image is already pushed, and on 2026-09-15 that outage marked
        # nine published images as failures across four runs.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
          # Sigstore's transparency log (rekor.sigstore.dev) refused every signature
          # on 2026-09-15, three runs in a row, AFTER the images were safely pushed —
          # so a public-good service being down reported nine published images as
          # failures. Retry rather than trust one attempt; still fail the job if the
          # signature never lands, because an unsigned image is not a release (S3).
          for i in 1 2 3 4 5; do
            cosign sign --yes "$ref" && break
            [ $i = 5 ] && { echo "::error::cosign could not sign $ref after 5 attempts — the image IS pushed; re-run this job when Sigstore recovers"; exit 1; }
            echo "sign attempt $i failed (Sigstore); retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          cosign verify \
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null
          echo "signed + verified $ref"
      - name: room for the SBOM scan
        # syft unpacks the image to read it. The ROCm vLLM and SGLang images are 25-30 GB: the docker
        # daemon had no room left to pull them again and the registry fallback filled /tmp (2026-09-19,
        # "no space left on device" for both). /mnt is the runner's large disk; the scan reads the
        # registry directly instead of asking the daemon for a second copy.
        run: sudo mkdir -p /mnt/syft-tmp && sudo chown "$USER" /mnt/syft-tmp
      - uses: anchore/sbom-action@v0
        env:
          TMPDIR: /mnt/syft-tmp
          SYFT_DEFAULT_IMAGE_PULL_SOURCE: registry
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: attach the SBOM to the image
        # The worker images are mostly someone else's base (vLLM, llama.cpp,
        # ROCm), so the SBOM is the only place a customer can see what they are
        # actually running and under which licences.
        # The attestation is written to the same transparency log as the signature,
        # so it gets the same terms: retried, fatal on a tag build, not a failed job
        # on a manual dispatch. On 2026-09-19 six images that were pushed AND signed
        # were reported as failures because this step had one attempt and the log
        # refused it.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
          for i in 1 2 3 4 5; do
            cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$ref" && break
            [ $i = 5 ] && { echo "::error::cosign could not attest the SBOM of $ref after 5 attempts — the image IS pushed and signed; re-run this job when Sigstore recovers"; exit 1; }
            echo "attest attempt $i failed (Sigstore); retrying in $((i * 30))s"
            sleep $((i * 30))
          done
