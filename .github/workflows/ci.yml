name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Minutes: this repo is PRIVATE, so every job is billed against the 2,000
# min/month Free quota and macOS bills at 10x. Linux runs on every push/PR;
# the macOS leg only on release tags (Go cross-compiles; the macOS run is a
# smoke test, not a gate).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        include:
          - os: macos-14
    runs-on: ${{ matrix.os }}
    if: matrix.os != 'macos-14' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -trimpath -o opod ./cmd/opod

      - name: smoke-test help + version
        run: |
          ./opod version
          ./opod help

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
