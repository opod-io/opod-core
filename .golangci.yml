version: "2"

run:
  timeout: 5m
  go: '1.25'

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      # Common Close + best-effort cleanup patterns where we knowingly drop
      # the error. Matches what v1.61 implicitly ignored before the v2 bump.
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Stmt).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*compress/gzip.Writer).Close
        - (*bufio.Scanner).Buffer
        - (github.com/opod-io/opod/internal/store.Store).Close
        # Terminal output — error means "stdout/stderr is closed", which
        # would already be killing the process. Not worth a check at every
        # call site.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - os.RemoveAll
    govet:
      enable-all: true
      disable:
        - fieldalignment   # noisy; revisit if memory becomes a concern
        - shadow
    revive:
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: redefines-builtin-id
    staticcheck:
      # Disable QF* (Quick-Fix) refactor suggestions — these are style hints,
      # not bugs. Default-on in v2; were opt-in in v1. Also drop:
      #  S1017  — HasPrefix+TrimPrefix collapse; explicit form is clearer
      #           in the bearer-token parsing path
      #  ST1000 — "package comment should be of the form 'Package X ...'";
      #           we have multiple files per package with file-level header
      #           comments, which the linter mis-detects as package
      #           comments. Disabling avoids a global rewrite for cosmetics.
      #  ST1020 — method-comment-should-start-with-method-name; same family
      checks:
        - all
        - -QF1001
        - -QF1003
        - -QF1008
        - -QF1012
        - -S1017
        - -ST1000
        - -ST1020
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - unused
      # SA5011 "possible nil pointer dereference" on the standard test idiom
      #   x := f(); if x == nil { t.Fatal(...) }; use(x)
      # staticcheck models (*testing.T).Fatal as terminating and gets this
      # right almost everywhere — 3 of the 24 occurrences of this idiom in the
      # tree are reported and the other 21 are not, and a minimal copy of a
      # reported one is sometimes reported and sometimes not. The code is
      # correct: Fatal does not return, and a nil there would panic the test
      # either way. Scoped to tests so the check stays fully armed in
      # everything that ships.
      - path: _test\.go$
        text: "SA5011"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
