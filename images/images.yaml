# The images this repository builds, as data. Embedded in the opod binary and
# printed by `opod image ls | show | recommend` (add --json for a script or an
# agent). images/build.sh and .github/workflows/images.yml stay what the two
# lanes execute; cmd/opod/images_drift_test.go holds this file to them — name,
# Dockerfile, base and platforms — so a row here is a row that is really built.
#
# One row per image:
#   role        leader | worker
#   engine      the core engine driver the worker runs (internal/engines)
#   vendor      nvidia | amd | intel | tt | cpu — the accelerator the base is built for
#   arch        platforms the image is published for
#   base        the upstream image, tag without digest (the digest lives with the lanes)
#   weights     what the engine loads: gguf (one file) | safetensors (a Hugging Face repo)
#   gang        how a worker on this image takes part in a model split across nodes:
#               rpc (llama.cpp RPC parts) | ray (vLLM multi-node) | omitted = one node only
#   proven      true once this image has served requests on the hardware it names
#   requires    what the node must provide before the container can see the device
#   upstream    true = run as the vendor publishes base (no dockerfile, never built or pushed here,
#               because its licence forbids a derived copy); opod is copied in at start
#   notes       limits a reader must know before choosing it
schema: 1
registry: ghcr.io/opod-io

images:
  - name: opod-leader
    role: leader
    arch: [amd64, arm64]
    dockerfile: images/leader/Dockerfile
    base: debian:bookworm-slim
    proven: true
    summary: The leader of one endpoint - OpenAI gateway, router, auth, join tokens. No engine, no GPU.
    notes:
      - Runs anywhere, including a node without an accelerator.

  - name: opod-worker-llamacpp-nvidia
    role: worker
    engine: llamacpp
    vendor: nvidia
    arch: [amd64]
    dockerfile: images/worker-llamacpp/Dockerfile.rpc-cuda
    base: ghcr.io/ggml-org/llama.cpp:full-cuda
    weights: [gguf]
    gang: rpc
    proven: true
    hardware: NVIDIA GPUs (CUDA)
    families: [nvidia:turing, nvidia:ampere, nvidia:ada, nvidia:hopper, nvidia:blackwell]
    requires:
      - NVIDIA driver and the NVIDIA container runtime on the node
    summary: llama.cpp on CUDA. GGUF models, whole on one card or split across nodes as RPC parts.

  - name: opod-worker-llamacpp-amd
    role: worker
    engine: llamacpp
    vendor: amd
    arch: [amd64]
    dockerfile: images/worker-llamacpp/Dockerfile.rpc-rocm
    base: ghcr.io/ggml-org/llama.cpp:full-rocm
    weights: [gguf]
    gang: rpc
    proven: true   # served on a Radeon RDNA3 card 2026-10-23 and 2026-10-25 (one card, no RPC parts - see notes)
    hardware: AMD Radeon (gfx1030, gfx1100-1102, gfx1150-1151, gfx1200-1201) and Instinct (gfx908, gfx90a, gfx942)
    families: [amd:rdna2, amd:rdna3]
    requires:
      - amdgpu driver on the node; /dev/kfd and /dev/dri passed to the container
    summary: llama.cpp on ROCm. GGUF models, whole on one card or split across nodes as RPC parts.
    notes:
      - The RPC pair is source-built for Radeon and Instinct in one binary; that build still owes its run on hardware (a tarball-lifted pair served on a 3x RX 7900 XTX host).

  - name: opod-worker-llamacpp-intel
    role: worker
    engine: llamacpp
    vendor: intel
    arch: [amd64]
    dockerfile: images/worker-llamacpp/Dockerfile.rpc-sycl
    base: ghcr.io/ggml-org/llama.cpp:full-intel
    weights: [gguf]
    gang: rpc
    proven: true
    hardware: Intel Arc A770 / Arc Pro B60 (SYCL, oneAPI; served on an Arc A770)
    families: [intel:xe-hpg, intel:xe2]
    requires:
      - i915 or xe driver on the node; /dev/dri passed to the container
    summary: llama.cpp on SYCL. GGUF models, whole on one card or split across nodes as RPC parts.
    notes:
      - Served whole-model on one Arc A770, and as the Intel part of mixed-vendor RPC gangs (with NVIDIA, and with NVIDIA and AMD).
      - An all-Intel RPC gang needs GGML_SYCL_ENABLE_OPT=0 on the rpc-server (e763153); an image built before that fails to form one on Q4/Q8 GGUF weights.
      - The Arc Pro B60 has not served.

  - name: opod-worker-llamacpp-cpu
    role: worker
    engine: llamacpp
    vendor: cpu
    arch: [amd64, arm64]
    dockerfile: images/worker-llamacpp/Dockerfile.rpc-cpu
    base: ghcr.io/ggml-org/llama.cpp:full
    weights: [gguf]
    gang: rpc
    proven: true
    hardware: No accelerator - CPU only
    summary: llama.cpp on the CPU, for dev clusters, kind and CI. Carries the RPC pair, so gang drills need no GPU.
    notes:
      - For small models and tests; not a serving choice when the node has a GPU.

  - name: opod-worker-vllm-nvidia
    role: worker
    engine: vllm
    vendor: nvidia
    arch: [amd64]
    dockerfile: images/worker-vllm/Dockerfile
    base: vllm/vllm-openai:v0.33.0
    weights: [safetensors]
    gang: ray
    proven: true   # v0.33.0 served on an RTX 3060 Ti 2026-11-02
    hardware: NVIDIA GPUs (CUDA)
    families: [nvidia:turing, nvidia:ampere, nvidia:ada, nvidia:hopper, nvidia:blackwell]
    requires:
      - NVIDIA driver and the NVIDIA container runtime on the node
    summary: vLLM on CUDA. Safetensors models from a Hugging Face repo; tensor parallel inside a node, Ray across nodes.
    notes:
      - 'v0.33.0 served 2026-11-02 on one RTX 3060 Ti (Ampere): Qwen3-1.7B, serving 5m15s after create; one prompt at temperature 0, 12 times, gave 12 of 12 identical correct answers. Ray gangs and tensor parallel have not been re-run on v0.33.0.'
      - 'KV connector: read 2026-10-23 on v0.27.1 (nixl and nixl_cu12 1.3.1, a NIXL agent starts and lists the UCX backend; mooncake_transfer_engine 0.3.10.post2). Not re-read on v0.33.0. A prefill/decode pair has not been run through it.'

  - name: opod-worker-vllm-amd
    role: worker
    engine: vllm
    vendor: amd
    arch: [amd64]
    dockerfile: images/worker-vllm/Dockerfile
    base: vllm/vllm-openai-rocm:v0.33.0
    weights: [safetensors]
    proven: true   # served on a Radeon RDNA3 host 2026-11-02 (one RX 7900 XTX, Qwen3-1.7B)
    hardware: AMD Instinct (MI200, MI300, MI350) and Radeon / Radeon Pro (RX 7000, RX 9000, Ryzen AI Max) - one build
    families: [amd:cdna, amd:rdna3, amd:rdna4]
    requires:
      - amdgpu driver on the node that runs ROCm 10.0 userspace (served on amdgpu 6.10.5, kernel 6.8); /dev/kfd and /dev/dri passed to the container
    summary: vLLM on ROCm, vLLM's own image. Safetensors models from a Hugging Face repo.
    notes:
      - 'One build for both AMD families: the base is compiled for gfx90a, gfx942, gfx950, gfx1100, gfx1101, gfx1150, gfx1151, gfx1200 and gfx1201 (its PYTORCH_ROCM_ARCH). RDNA2 (gfx103x) is not in that list.'
      - 'Replaces AMD''s rocm/vllm 0.23 RDNA base, which vLLM''s docs mark deprecated. On that base, 2026-09-19 to 2026-11-02: one card served; tensor parallel across two consumer Radeon cards faulted over P2P and answered wrong with P2P disabled (the machine, not the image); Qwen3 needed a backport of vllm-project/vllm#56888, which this base already contains.'
      - 'Tensor parallel answers wrong on this image too (two RX 7900 XTX, v0.33.0, 2026-11-02), and the cause is two defects together: an amdgpu driver that reports a gfx11 cache-line size of 0 (6.10.5 did), and the 64-byte fallback ROCr applies to it in ROCm 10.0.0 and 10.1.0 (this image''s ROCm). HIP''s small staged copies then read stale L2 lines (ROCm/rocm-systems#14886), so an RCCL all-gather writes to the wrong ranks'' slots, and vLLM gathers its tensor-parallel logits with that all-gather. All-reduce stays exact. AMD_OPT_FLUSH=0 hides it (two cards answered right, eager and graph mode; cost not measured). ROCr fix rocm-systems#11617 (fallback 256; on develop, in no release yet) made it right on the same host. The control plane refuses vLLM tensor parallel on AMD until an image with that fix is pinned.'
      - 'Served 2026-11-02 on one RX 7900 XTX (gfx1100): Qwen3-1.7B, serving 4m34s after create; the Qwen3 repeat test (one prompt, temperature 0, 12 times) gave 12 of 12 identical correct answers with no patch, where the 0.23 RDNA base gave 0 of 12 unpatched. Instinct and RDNA4 have not been run.'
      - 'KV connector: the base carries nixl_rocm, the package vLLM''s NIXL connector imports on ROCm. Not read on this image yet; no prefill/decode pair has served through it.'

  - name: opod-worker-vllm-intel
    role: worker
    engine: vllm
    vendor: intel
    arch: [amd64]
    dockerfile: images/worker-vllm/Dockerfile
    base: vllm/vllm-openai-xpu:v0.33.0
    weights: [safetensors]
    proven: false
    hardware: Intel Xe2 / Xe3 GPUs (Arc B-series, Arc Pro B60) and Data Center GPU Max (XPU) - NOT Arc A-series
    families: [intel:xe2, intel:xe-hpc]
    requires:
      - i915 or xe driver on the node; /dev/dri passed to the container
      - an Xe2 or newer GPU - upstream's XPU attention kernels refuse older silicon
    summary: vLLM on Intel XPU, vLLM's own image. Safetensors models from a Hugging Face repo, one card.
    notes:
      - Single-card serving only - no Ray gang has been run on the XPU backend.
      - 'Arc A-series (Xe-HPG, e.g. A770) does not serve: run on an A770 2026-09-19 (on intel/vllm 0.21) the engine needed --dtype=half (bfloat16 is refused on that card) and fp64 emulation (OverrideDefaultFP64Settings=1, IGC_EnableDPEmulation=1) to start, loaded the model, and died on the first request with "Only XE2/XE3 cutlass kernel is supported currently". Use the llama.cpp Intel image on those cards.'
      - No Xe2 card has served through this image yet.
      - 'KV connector: the base builds NIXL v1.5.0 and UCX (/opt/ucx). Not read on this image yet; no prefill/decode pair has served through it.'

  - name: opod-worker-vllm-tt
    role: worker
    engine: vllm
    vendor: tt
    arch: [amd64]
    dockerfile: images/worker-tt/Dockerfile
    base: ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.10.0-55fd115-aa4ae1e
    weights: [safetensors]
    proven: true
    hardware: Tenstorrent Wormhole / Blackhole (served on a Blackhole p150b)
    families: [tt:blackhole, tt:wormhole]
    requires:
      - tt-kmd loaded on the node
      - /dev/hugepages-1G mounted
      - the model spec of the model being served mounted into the container
    summary: Tenstorrent's tt-metal vLLM build. The vendor launcher starts the engine; opod proxies its OpenAI API.
    notes:
      - The base tag must match the tt-metal and vLLM commits of the model spec being served - see images/worker-tt/README.md. Rebuild with VLLM_TT_BASE= for another spec.

  - name: opod-worker-sglang-nvidia
    role: worker
    engine: sglang
    vendor: nvidia
    arch: [amd64]
    dockerfile: images/worker-sglang/Dockerfile
    base: lmsysorg/sglang:v0.5.21-cu130
    weights: [safetensors]
    gang: sglang
    proven: true
    hardware: NVIDIA GPUs (CUDA)
    families: [nvidia:turing, nvidia:ampere, nvidia:ada, nvidia:hopper, nvidia:blackwell]
    requires:
      - NVIDIA driver 580 or newer (the base is CUDA 13) and the NVIDIA container runtime on the node
    summary: SGLang on CUDA. Safetensors models from a Hugging Face repo; multi-node gangs via SGLang's own launcher.
    notes:
      - Multi-node gangs work via SGLang's own distributed launcher (--dist-init-addr/--nnodes/--node-rank); rank 0 serves the group (gang sglang).
      - Served on an NVIDIA card 2026-09-19; the row had said proven false until 2026-09-21.
      - 'SGLang v0.5.21 cannot run a pipeline (pp > 1) of a Llama-family model with tied word embeddings (LlamaForCausalLM and the classes that reuse it - Mistral, Phi3, InternLM3, IQuestCoder): the last stage has no output layer and crashes in _compute_lm_head. Core reads the model config.json and refuses that gang by name (sglang_pp_tied_llama) before forming it; use tensor parallelism, one stage, or vLLM. Qwen2 with tied embeddings serves on pp=2.'
      - 'KV connector (read 2026-10-23): carries nixl (a NIXL agent starts and lists the UCX backend) and mooncake. A prefill/decode pair has not been run through it.'

  - name: opod-worker-sglang-amd
    role: worker
    engine: sglang
    vendor: amd
    arch: [amd64]
    dockerfile: images/worker-sglang/Dockerfile
    base: lmsysorg/sglang:v0.5.19-rocm700-mi30x
    weights: [safetensors]
    gang: sglang
    proven: false
    hardware: AMD Instinct MI200 / MI300 only
    families: [amd:cdna]
    requires:
      - amdgpu driver on the node; /dev/kfd and /dev/dri passed to the container
    summary: SGLang on ROCm (Instinct only). Safetensors models from a Hugging Face repo; multi-node gangs via SGLang's own launcher.
    notes:
      - Instinct only - upstream has no RDNA build, so a Radeon card serves through llama.cpp or vLLM instead. MI350 needs the -mi35x base (rebuild with SGLANG_AMD_BASE=).
      - 'Confirmed on a Radeon RX 7900 XTX 2026-09-19: the worker joins, SGLang starts and its scheduler dies with "HIP error: invalid device function" - no kernel in the image is compiled for RDNA.'
      - Multi-node gangs work via SGLang's own distributed launcher (--dist-init-addr/--nnodes/--node-rank); rank 0 serves the group (gang sglang).

  - name: opod-worker-sglang-intel
    role: worker
    engine: sglang
    vendor: intel
    arch: [amd64]
    dockerfile: images/worker-sglang/Dockerfile
    base: lmsysorg/sglang:v0.5.22-xpu
    weights: [safetensors]
    proven: false
    hardware: Intel Arc B-series and Arc Pro B-series (Xe2), upstream's target; Arc A-series (Xe-HPG) serves with the default attention backend
    families: [intel:xe-hpg, intel:xe2]
    requires:
      - i915 or xe driver on the node; /dev/dri passed to the container
    summary: SGLang on Intel XPU (upstream's -xpu image). Safetensors models from a Hugging Face repo, one card.
    notes:
      - Upstream names Arc B-series and Arc Pro B-series as its targets and verified its model table on an Arc B580. No Xe2 card has served through this image yet.
      - 'Arc A770 (Xe-HPG), 2026-10-31: the upstream v0.5.22-xpu image served Qwen2.5-0.5B (bf16) on one card with no flags - SGLang chose device xpu, attention backend triton and sampling backend intel_xpu, and answered correctly. The intel_xpu attention backend upstream''s examples name was not tried on that card.'
      - Single-card serving only - no gang has been run on the XPU backend.

  - name: nvcr-trtllm-nvidia
    role: worker
    engine: trtllm
    vendor: nvidia
    arch: [amd64, arm64]
    upstream: true
    base: nvcr.io/nvidia/tensorrt-llm/release:1.2.1
    weights: [safetensors]
    proven: true   # served on one RTX 5090 2026-10-23 and 2026-10-25
    hardware: NVIDIA GPUs (CUDA; Ampere and newer)
    requires:
      - NVIDIA driver and the NVIDIA container runtime on the node
      - the owner's acceptance of NVIDIA's container licence (the image is pulled from nvcr.io as NVIDIA publishes it)
    summary: TensorRT-LLM's trtllm-serve on the PyTorch backend. Safetensors from the Hub, no engine build. Run as NVIDIA publishes it; opod is copied in at start.
    notes:
      - Not rebuilt or pushed by opod - NVIDIA's container licence forbids a derived copy, so the chart names nvcr.io directly.
      - One node only - its multi-node mode needs MPI, which core does not carry.
      - No runtime LoRA, no sleep mode; images are refused until a vision model is proven on it.
      - 'KV connector (read 2026-10-23 on 1.2.1): NIXL is in /opt/nvidia/nvda_nixl (cu13; UCX and GDS plugins) with UCX from HPC-X, and TensorRT-LLM ships its own NIXL, UCX and Mooncake transceiver wrappers; cache_transceiver_config.backend takes DEFAULT, UCX, NIXL, MOONCAKE or MPI. No prefill/decode split on this engine is rendered or proven yet.'
